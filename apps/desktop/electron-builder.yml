appId: dev.sfab.bench
productName: sfab-bench
copyright: © 2026 SFab
directories:
  app: app
  buildResources: build
  output: release
# Signing is decided in package.mjs from the environment. With no CSC_NAME /
# CSC_LINK it passes identity=null and ad-hoc signs. Gatekeeper then refuses the
# first launch: System Settings → Privacy & Security → Open Anyway.
mac:
  target: dir
  category: public.app-category.developer-tools
  icon: build/icon.icns
# No asar. The wasm kernel is read off disk by path, the utility process forks a
# real file, and nothing here benefits from being in an archive.
asar: false
# `**/*` is not enough: electron-builder still drops lockfiles from
# node_modules. package.mjs copies harness `dist/bridge` files back in.
files:
  - "**/*"
