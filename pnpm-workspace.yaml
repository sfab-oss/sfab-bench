packages:
  - apps/*
  - packages/*

allowBuilds:
  # Windows installer packaging, pulled in by electron-builder. We do not ship Windows.
  electron-winstaller: false
  esbuild: true

minimumReleaseAgeExclude:
  - zod@4.6.5
  - '@ai-sdk/gateway@4.0.81'
  - '@ai-sdk/harness-acp@1.0.49'
  - '@ai-sdk/harness-codex@1.0.113'
  - '@ai-sdk/harness-cursor@1.0.24'
  - '@ai-sdk/harness-grok-build@1.0.48'
  - '@ai-sdk/harness-opencode@1.0.113'
  - '@ai-sdk/harness@1.0.111'
  - ai@7.0.101
